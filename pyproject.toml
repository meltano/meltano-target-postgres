[project]
name = "target-postgres"
dynamic = [ "version" ]
description = "Singer target for loading data into PostgreSQL"
readme = "README.md"
authors = [
    { name = "Edgar Ramírez Mondragón", email = "emondragon@meltano.com" }
]
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]~=3.3",
    "jsonschema~=4.26",
    "pyarrow~=25.0",
    "adbc-driver-postgresql~=1.11",
]

[project.scripts]
target-postgres = "target_postgres.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "testcontainers[postgres]>=4.15",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.hatch.version]
fallback-version = "0.0.0dev0"
source = "vcs"

[tool.pytest]
testpaths = ["tests"]

[tool.coverage.run]
source = ["target_postgres"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TID"]
ignore = [
    "E722",   # bare-except
]
