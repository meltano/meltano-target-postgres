[project]
name = "target-postgres"
version = "0.1.0"
description = "Singer target for loading data into PostgreSQL"
readme = "README.md"
authors = [
    { name = "Edgar Ramírez Mondragón", email = "emondragon@meltano.com" }
]
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]~=3.3",
    "jsonschema~=4.26",
]

[project.scripts]
target-postgres = "target_postgres.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9",
    "testcontainers[postgres]>=4.15.0rc4",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.pytest]
testpaths = ["tests"]
