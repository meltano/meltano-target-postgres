[project]
name = "target-postgres"
dynamic = [ "version" ]
description = "Singer target for loading data into PostgreSQL"
readme = "README.md"
authors = [
    { name = "Edgar Ramírez Mondragón", email = "emondragon@meltano.com" }
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]~=3.3",
    "jsonschema~=4.26",
    "pyarrow~=25.0",
    "adbc-driver-postgresql~=1.11",
]

[project.scripts]
target-postgres = "target_postgres.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-cov~=7.1",
    "ruff~=0.16.2",
    "testcontainers[postgres]~=4.15",
    "types-jsonschema>=4.26.0.20260518",
]

[tool.hatch.version]
fallback-version = "0.0.0dev0"
source = "vcs"

[tool.pytest]
testpaths = ["tests"]

[tool.coverage.run]
source = ["target_postgres"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "TID"]
ignore = [
    "E722",   # bare-except
]

[tool.tox]
requires = [
  "tox>=4.55",
  "tox-uv>=1.35",
]
env_list = [
  "lint",
  "test"
]

[tool.tox.env.lint]
description = "lint source"
dependency_groups = [ "dev" ]
commands = [
  [ "ruff", "check" ],
  [ "ruff", "format", "--check" ],
]

[tool.tox.env.test]
description = "run tests on Python {py_dot_ver}"

[tool.tox.env_run_base]
dependency_groups = [ "dev" ]
commands = [ [ "pytest", { replace = "posargs", default = [ "tests" ], extend = true } ] ]
